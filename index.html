<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bible Text Folder</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.webmanifest">
</head>
<body>
    <div class="folder-container">
        <div id="side-tabs" class="tabs-container"></div>

        <main class="paper-page">
            <div id="textcontent">
                <p>Це милість Господня, що ми не погинули, бо не покінчилось Його милосердя, нове воно кожного ранку, велика бо вірність Твоя!</p>
            </div>
            <div style="text-align: center; padding: 20px; opacity: 0.3; font-size: 12px; font-family: sans-serif;">
            Версія: <span id="app-version">...</span>
            </div>
        </main>
    </div>
    

    
    <div id="addDialog" class="modal" style="display:none;">
        <div class="modal-content">
            <div class="modal-header-container">
                <input type="text" id="pageTitle" placeholder="Назва вкладки (напр. Частина 1)">
                <div class="modal-buttons">
                    <button class="save-btn" onclick="saveNewPage()">Зберегти</button>
                    <button class="cancel-btn" onclick="closeAddDialog()">Скасувати</button>
                </div>
            </div>
    
            <div contenteditable="true" id="inputArea" placeholder="Вставте або напишіть текст тут..."></div>
        </div>
    </div>

    <script src="textPage.js"></script>
<script>
  async function displayVersion() {
    try {
      // 1. Читаємо файл sw.js як текст
      const response = await fetch('sw.js');
      const text = await response.text();

      // 2. Шукаємо в тексті щось схоже на v1.0142 або цифри після версії
      // Цей рядок шукає лапки з цифрами/крапками всередині
      const match = text.match(/v\d+\.\d+/); 
      
      if (match) {
        // 3. Якщо знайшли — замінюємо текст на сторінці
        document.getElementById('app-version').innerText = match[0];
      }
    } catch (e) {
      console.log("Не вдалося отримати версію з sw.js");
    }
  }

  // Запускаємо перевірку
  displayVersion();
</script>
</body>
</html>
