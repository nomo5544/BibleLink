<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bible Text Folder</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.webmanifest">
</head>
<body>
    <div class="folder-container">
        <div id="side-tabs" class="tabs-container"></div>

        <main class="paper-page">
            <div id="textcontent">
                <p>Це милість Господня, що ми не погинули, бо не покінчилось Його милосердя, нове воно кожного ранку, велика бо вірність Твоя!</p>
            </div>
            <div style="text-align: center; padding: 20px; opacity: 0.3; font-size: 13px; font-family: sans-serif;">
                Версія: <span id="app-version" style="cursor: pointer;">...</span>
            </div>
        </main>
    </div>
    

    
    <div id="addDialog" class="modal" style="display:none;">
        <div class="modal-content">
            <div class="modal-header-container">
                <input type="text" id="pageTitle" placeholder="Назва вкладки (напр. Частина 1)">
                <div class="modal-buttons">
                    <button class="save-btn" onclick="saveNewPage()">Зберегти</button>
                    <button class="cancel-btn" onclick="closeAddDialog()">Скасувати</button>
                </div>
            </div>
    
            <div contenteditable="true" id="inputArea" placeholder="Вставте або напишіть текст тут..."></div>
        </div>
    </div>

    <script src="textPage.js"></script>
    <script>
      async function displayVersion() {
        try {
          const response = await fetch('sw.js');
          const text = await response.text();
          const match = text.match(/v\d+\.\d+/); 
          const versionElement = document.getElementById('app-version');
          if (match) {
            versionElement.innerText = match[0];
            // Функція оновлення при кліку (без візуальних змін тексту)
            versionElement.onclick = async function() {
              if (confirm("Оновити кеш додатка та перезавантажити сторінку?")) {
                const cacheNames = await caches.keys();
                await Promise.all(cacheNames.map(name => caches.delete(name)));
                
                const registrations = await navigator.serviceWorker.getRegistrations();
                for (let registration of registrations) {
                  await registration.unregister();
                }
                window.location.reload(true);
              }
            };
          }
        } catch (e) {
          console.log("Помилка отримання версії");
        }
      }
      displayVersion();
    </script>
</body>
</html>
